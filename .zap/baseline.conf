# OWASP ZAP Baseline rule allowlist for SKIFF.
#
# Format is:  <rule-id>\t<IGNORE|WARN|FAIL>\t[# comment]
# Columns are TAB-separated (the upstream parser splits on `\t`).
#
# Local triage run (docs/hardening/security-scans.md) classified every
# rule below as a false positive or a defensive nudge that is not a
# release blocker for SKIFF's posture. Each line documents why.
#
# Review the local-scan report before flipping any line from IGNORE to
# WARN/FAIL; a rule marked IGNORE is a deliberate decision, not a
# baseline-noise bypass.

# ── Suspicious comments (rule 10027) ─────────────────────────────────
# ZAP matches the literal text `API_TOKEN=` in the login-page
# instruction ("If you chose Save .env, the token is in that file
# as API_TOKEN=") and the "INSECURE MODE" banner string. Both are
# intentional user-facing UI copy, not leaked code comments.
10027	IGNORE	# user-facing UI strings, not code comments

# ── Storable and Cacheable Content (rule 10049) ──────────────────────
# SKIFF's `/`, `/LICENSE`, `/api/docs` are public static content
# intentionally cacheable. `/robots.txt` / `/sitemap.xml` are 404s
# and therefore irrelevant. No sensitive data on any of these paths.
10049	IGNORE	# public static content, no sensitive data

# ── Private IP Disclosure (rule 2) ───────────────────────────────────
# Single occurrence is in `static/pages/wizard.js` at the
# remote-tunnel EXAMPLE snippet `tcp://10.0.0.5:2376`. Documented
# example for operators, not a leaked production IP.
2	IGNORE	# documented example in wizard UI copy

# ── Cross-Origin-Embedder-Policy (rule 90004) ────────────────────────
# COEP is a newer header for cross-origin isolation
# (SharedArrayBuffer, high-resolution timers). SKIFF is a same-origin
# SPA that uses neither. Emitting COEP would require opting into
# cross-origin isolation semantics that add no defensive value for
# this surface.
90004	IGNORE	# same-origin SPA, cross-origin isolation not applicable

# Every other rule stays at its default (WARN or FAIL). Any new
# finding the scheduled scan surfaces gets triaged and either fixed
# in code OR added here with a documented justification.
