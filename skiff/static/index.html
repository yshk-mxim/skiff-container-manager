<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKIFF Container Manager</title>
<!-- Stylesheet lives in its own file so browser caching + CSP (style-src
     'self') both work without inline style. Theme tokens, utility
     classes, and widget rules are all in styles.css. -->
<link rel="stylesheet" href="/static/styles.css">
<!-- Theme pre-init runs before the main scripts to avoid flash-of-wrong-
     theme. Served as a same-origin file so the strict CSP script-src
     'self' passes without an inline-script exception. -->
<script src="/static/core/theme-init.js"></script>
</head>
<body>
<div id="status-banner" class="status-banner"></div>
<div id="toast-container" class="toast-container"></div>
<div class="app">
  <nav class="sidebar">
    <div class="sidebar-brand">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="6" fill="#0d9488"/><rect x="6" y="6" width="16" height="16" rx="2" stroke="white" stroke-width="1.5" fill="none"/><line x1="6" y1="11" x2="22" y2="11" stroke="white" stroke-width="1.5"/><line x1="6" y1="16" x2="22" y2="16" stroke="white" stroke-width="1.5"/><circle cx="9" cy="8.5" r="1" fill="white"/><circle cx="9" cy="13.5" r="1" fill="white"/><circle cx="9" cy="18.5" r="1" fill="white"/></svg>
      <span>SKIFF Container Manager</span>
    </div>
    <!-- Nav links rendered by core/sidebar.js from the UI.registerPage()
         registry. Adding a new page = one JS file; sidebar updates
         automatically. Persona filtering honoured. Mount point below. -->
    <div id="sidebar-mount"></div>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-status" id="sidebar-status"><span class="dot"></span> <span>Connecting...</span></div>
    <div class="sidebar-footer col">
      <button id="sidebar-logout" class="sidebar-logout">Sign out</button>
      <!-- Theme toggle — three-state cycle (System → Light → Dark → System).
           Icons rendered inline to stay in the CSP-safe static file. Active
           state is driven by data-theme-pref on the <html> element which the
           theme-init script syncs on load. -->
      <div class="theme-toggle-wrap">
        <div class="theme-toggle" role="radiogroup" aria-label="Theme">
          <button type="button" data-theme-value="" title="Follow system preference" aria-label="System theme">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="9" rx="1"/><path d="M5 14h6M8 12v2"/></svg>
          </button>
          <button type="button" data-theme-value="light" title="Light theme" aria-label="Light theme">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.4 1.4M11.55 11.55l1.4 1.4M3.05 12.95l1.4-1.4M11.55 4.45l1.4-1.4"/></svg>
          </button>
          <button type="button" data-theme-value="dark" title="Dark theme" aria-label="Dark theme">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5Z"/></svg>
          </button>
        </div>
      </div>
      <div>SKIFF Container Manager</div>
      <div class="attr">&copy; 2026 Yakov Shkolnikov</div>
      <div class="attr"><a href="/api/docs" target="_blank">API docs</a> · <a href="/LICENSE" target="_blank">MIT License</a></div>
    </div>
  </nav>
  <div class="main" id="main"></div>
</div>

<!-- Strings bundle loads before ui.js so the `t(key)` helper in ui.js
     can find window.SKIFF_STRINGS. A future commit may swap this line
     with a runtime-picked `/static/strings.<lang>.js`; call sites using
     `t(...)` don't change. -->
<script src="/static/strings.en.js"></script>
<script src="/static/ui.js"></script>
<script src="/static/core/theme.js"></script>
<!-- Wizard loads BEFORE app.js because app.js's init IIFE calls
     checkSetupState() synchronously (before any await resolves). Wizard
     module defines only functions that reference app.js globals inside
     their bodies — resolution at call time, after app.js has loaded. -->
<script src="/static/pages/wizard.js"></script>
<script src="/static/app.js"></script>
<!-- Per-page modules. Each sets window.* globals that the dispatch
     table in app.js::showPage() looks up at click time. Add a new page
     here when extracted from app.js. -->
<script src="/static/pages/images.js"></script>
<script src="/static/pages/volumes.js"></script>
<script src="/static/pages/networks.js"></script>
<script src="/static/pages/compose.js"></script>
<script src="/static/pages/system.js"></script>
<!-- Sidebar renderer reads UI.registerPage() declarations from the page
     modules above. Must load after them. -->
<script src="/static/core/sidebar.js"></script>
<!-- Command palette loads last so it can see apiFetch, showPage, etc.
     from both app.js and the page modules above. -->
<script src="/static/core/palette.js"></script>
</body>
</html>
