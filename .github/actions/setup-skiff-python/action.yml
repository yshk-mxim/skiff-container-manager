name: Setup SKIFF Python
description: >-
  Checkout the repo, install Python 3.12, cache pip, and install the
  dev extras. Shared by ci.yml / security.yml / future e2e.yml so the
  setup block doesn't drift between workflows.

inputs:
  python-version:
    description: Python version to install (default 3.12).
    required: false
    default: "3.12"
  install-extras:
    description: >-
      Selects the hash-pinned lock file to install. Empty string ->
      runtime-only requirements.txt (lean boot for a11y/ZAP). Any
      non-empty value -> requirements-dev.txt, the runtime+dev+e2e
      superset (covers both `dev` and `dev,e2e` callers). The exact
      string past "non-empty" no longer maps to pip extras.
    required: false
    default: "dev"

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip

    - name: Install dependencies
      shell: bash
      # Supply-chain hardening for OpenSSF Scorecard "Pinned-Dependencies":
      # install every third-party dep from a hash-pinned lock file with
      # `--require-hashes` (rejects a tampered PyPI artifact even at the
      # pinned version), then install SKIFF itself editable with `--no-deps`
      # so no transitive dependency is ever fetched unverified. Scorecard
      # treats both of these forms as pinned; a plain `pip install -e .[..]`
      # is not. Regenerate the locks with `make deps`.
      #
      # `install-extras` is only tested for empty/non-empty here, so it is
      # passed via env and quoted — a hostile caller value cannot reach a
      # shell or a package spec (CODEOWNERS-gated today; zero-trust anyway).
      env:
        SKIFF_EXTRAS: ${{ inputs.install-extras }}
      run: |
        if [ -n "${SKIFF_EXTRAS}" ]; then
          pip install --require-hashes -r requirements-dev.txt
        else
          pip install --require-hashes -r requirements.txt
        fi
        pip install --no-deps -e .
