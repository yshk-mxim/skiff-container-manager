name: OpenSSF Scorecard

on:
  # Weekly scheduled scan — results publish to the GitHub Security tab.
  schedule:
    - cron: "0 6 * * 1"
  # Re-evaluate on branch-protection / dependency-update / workflow changes.
  branch_protection_rule:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: Run analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF
      id-token: write          # needed for publishing results (OIDC)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a  # v2.4.3
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Publish the score to the public OpenSSF dashboard for
          # transparency. Requires no PAT for public repos.
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scorecard-results
          path: scorecard.sarif
          retention-days: 30

      - uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v3.29.1
        with:
          sarif_file: scorecard.sarif
