name: Security Review

on:
  pull_request:
  workflow_dispatch:
  # Weekly ZAP baseline + nuclei schedule. Too slow for per-PR
  # (≈3–5 min) and the signal is cumulative — weekly is enough to
  # catch a regression within the SLA the single-maintainer posture
  # can support. Mondays at 07:00 UTC.
  schedule:
    - cron: "0 7 * * 1"

permissions:
  pull-requests: write
  contents: read

jobs:
  # Claude-Code security review runs only on PRs opened from branches in
  # this repo (where CLAUDE_API_KEY is available). Forked PRs and
  # Dependabot PRs skip this job at the `if:` gate — they cannot read
  # repo secrets. A second guard at the step level skips the review
  # when CLAUDE_API_KEY is unset (e.g. before the maintainer has
  # configured the secret), so the overall check stays green instead of
  # surfacing a confusing red X with "ANTHROPIC_API_KEY is not set".
  security:
    if: |
      github.event_name != 'pull_request' || (
        github.event.pull_request.head.repo.full_name == github.repository
        && github.actor != 'dependabot[bot]'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Detect CLAUDE_API_KEY availability
        id: key
        env:
          KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          if [ -n "${KEY}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_API_KEY is not configured for this repo; skipping Claude-Code security review."
          fi

      - if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          # Checklist lives in-repo so reviewers can update it without
          # touching this workflow. Keep the path stable.
          review-instructions-file: docs/dev/review-checklist.md

  # Run ruff + pip-audit again here — keeps the "security" signal
  # surfaced on every PR independent of ci.yml matrix flakiness.
  static-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Setup Python + dev deps
        uses: ./.github/actions/setup-skiff-python

      - name: Ruff security ruleset
        run: make security

      - name: pip-audit
        run: pip-audit --strict -r requirements.txt

  # SBOM + vulnerability scan via Anchore (Syft + Grype).
  # Both actions are pinned to commit SHA (not @v<major>); Dependabot
  # automates bumps and CODEOWNERS protects .github/ so SHA changes go
  # through maintainer review.
  sbom-and-vuln-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true
          upload-artifact-retention: 30

      - name: Vulnerability scan (Grype)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
        id: grype
        with:
          sbom: sbom.cdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: false

      - name: Upload Grype SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7  # v3.29.1
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}

  # Semgrep SAST — runs on every PR. Three rulesets chosen for SKIFF's
  # profile: p/owasp-top-ten (coverage baseline), p/python (lang-
  # specific smells), p/security-audit (general security heuristics).
  # Local triage (docs/hardening/security-scans.md §Semgrep) already
  # annotated the one false positive at `skiff/routers/images.py` —
  # inline comment explains the mitigation posture so this run stays
  # clean until a new finding appears.
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d  # pinned
        with:
          config: >-
            p/owasp-top-ten
            p/python
            p/security-audit
          generateSarif: "1"
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7  # v3.29.1
        with:
          sarif_file: semgrep.sarif

  # Trivy filesystem scan — vulnerabilities + secrets + misconfigs.
  # Runs on every PR; independent CVE DB to pip-audit so the two
  # together give cross-validated coverage of the runtime 10 deps.
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Trivy fs scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # pinned
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif
          exit-code: "1"
          ignore-unfixed: false
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7  # v3.29.1
        with:
          sarif_file: trivy.sarif

  # OWASP ZAP Baseline — dynamic HTTP scan against a running SKIFF.
  # Weekly schedule only: too slow for per-PR, and the passive-header
  # audit is a cumulative posture check, not a per-commit regression
  # gate. Baseline-conf allowlist lives at `.zap/baseline.conf` and
  # documents every triaged WARN so PR noise stays zero.
  zap-baseline:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Setup Python + dev deps
        uses: ./.github/actions/setup-skiff-python

      - name: Start SKIFF (background)
        env:
          API_TOKEN: ${{ secrets.ZAP_SKIFF_TOKEN }}
        run: |
          nohup python3 -m uvicorn skiff.app:app \
            --host 127.0.0.1 --port 18300 \
            --no-proxy-headers --forwarded-allow-ips "" \
            >zap-skiff.log 2>&1 &
          echo $! >zap-skiff.pid
          # Wait for /health to respond (up to 30 s)
          for i in $(seq 1 30); do
            curl -sSf http://127.0.0.1:18300/health >/dev/null && break
            sleep 1
          done
          curl -sSf http://127.0.0.1:18300/health

      - name: ZAP Baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25  # v0.15.0
        with:
          target: http://127.0.0.1:18300
          rules_file_name: .zap/baseline.conf
          fail_action: true
          # Markdown issue comment is off — single-maintainer posture,
          # the SARIF upload is the durable record.

      - name: Teardown SKIFF
        if: always()
        run: |
          if [ -f zap-skiff.pid ]; then
            kill "$(cat zap-skiff.pid)" 2>/dev/null || true
          fi
